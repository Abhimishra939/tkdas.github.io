name: Update Google Scholar profile data

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 05:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Google Scholar data via SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: wfz2In0AAAAJ
        run: python -u scripts/update_scholar_serpapi.py
      - name: Commit refreshed data
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar_data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Google Scholar data via SerpApi"
            git push
          fi
