name: Update Google Scholar profile data
on:
  schedule:
    - cron: '17 2 * * 1' # Every Monday, 02:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scraper
        run: pip install scholarly "bibtexparser==1.4.0"
      - name: Fetch Google Scholar data
        run: python scripts/update_scholar.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar_data.json
          git diff --cached --quiet || git commit -m "Update Google Scholar data"
          git push
