name: Update Google Scholar profile data

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 05:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper
        run: python -m pip install --upgrade pip && pip install scholarly "bibtexparser==1.4.0"

      - name: Fetch Google Scholar data (with timeout and retries)
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Google Scholar fetch attempt ${attempt}/3"
            if timeout 180s python -u scripts/update_scholar.py; then
              echo "Scholar data fetch completed successfully."
              exit 0
            else
              status=$?
              echo "Attempt ${attempt} failed (exit code ${status})."
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          echo "Google Scholar could not be reached after 3 attempts. Existing scholar_data.json will not be committed."
          exit 1

      - name: Commit refreshed data
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar_data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Google Scholar data"
            git push
          fi
