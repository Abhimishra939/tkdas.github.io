<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Publications | Dr. T.K. Das</title><style>
body{font-family:Inter,Arial,sans-serif;background:#F1EDE1;color:#1E2A1C;margin:0;line-height:1.6}.container{width:90%;max-width:1100px;margin:auto;padding:50px 0}h1{font-family:Georgia,serif;color:#1E2A1C}.top{background:#15150F;color:#F1EDE1;padding:20px 5%}.top a{color:#E3C685;text-decoration:none}.paper{background:#E7E1CE;border-top:3px solid #576B4C;padding:22px;margin:16px 0}.paper h3{margin:0 0 8px}.paper a{color:#576B4C}.meta{color:#57604F;font-size:.95rem}.status{color:#57604F;font-size:.9rem}
</style></head><body><div class="top"><a href="index.html">← Dr. T.K. Das Home</a></div><main class="container"><h1>Research Publications</h1><p class="status" id="status">Loading publications from the scheduled Google Scholar update…</p><div id="list"></div></main><script>
fetch('scholar_data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Data not available');return r.json()}).then(d=>{const list=document.getElementById('list');document.getElementById('status').textContent=`${d.publication_count??d.publications?.length??0} publications · Last updated: ${d.updated_at||'—'} · Data source: Google Scholar`;(d.publications||[]).forEach(p=>{const card=document.createElement('article');card.className='paper';const title=document.createElement('h3');title.textContent=p.title||'Untitled';const meta=document.createElement('p');meta.className='meta';meta.textContent=[p.authors,p.venue,p.year].filter(Boolean).join(' · ');card.append(title,meta);if(p.url){const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener';a.textContent='Open publication ↗';card.append(a)}list.append(card)})}).catch(e=>{document.getElementById('status').textContent='Scholar data could not be loaded. Please try again later.';console.error(e)});
</script></body></html>
